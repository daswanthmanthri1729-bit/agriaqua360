# Publishes (or updates) the GitHub Release named by release/assets.json "version" whenever that file
# changes. GitHub creates the tag itself. Assets are the already-built, tested files listed there (no secrets).
name: Release
on:
  push:
    paths: ['release/assets.json', 'release/NOTES.md', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested builds
        run: |
          set -euo pipefail
          mkdir out
          V=$(jq -r .version release/assets.json); echo "V=$V" >> "$GITHUB_ENV"
          curl -fsSL "$(jq -r .apk_url release/assets.json)" -o "out/AgriAqua360-$V.apk"
          for u in $(jq -r '.windows_parts[]' release/assets.json); do curl -fsSL "$u" >> out/AgriAqua360-Windows-x64.zip; done
          echo "$(jq -r .windows_sha256 release/assets.json)  out/AgriAqua360-Windows-x64.zip" | sha256sum -c -
          ls -la out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$V" >/dev/null 2>&1; then
            gh release upload "$V" out/* --clobber
            gh release edit "$V" --notes-file release/NOTES.md
          else
            gh release create "$V" out/* --target "$GITHUB_SHA" --title "AgriAqua 360 $V" --notes-file release/NOTES.md
          fi
