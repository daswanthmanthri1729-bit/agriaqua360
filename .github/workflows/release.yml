# Publishes a GitHub Release when a version tag (v*) is pushed.
# Assets are the already-built and tested files listed in release/assets.json (no secrets needed).
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download tested builds
        run: |
          set -euo pipefail
          mkdir out
          curl -fsSL "$(jq -r .apk_url release/assets.json)" -o "out/AgriAqua360-${GITHUB_REF_NAME}.apk"
          for u in $(jq -r '.windows_parts[]' release/assets.json); do curl -fsSL "$u" >> out/AgriAqua360-Windows-x64.zip; done
          echo "$(jq -r .windows_sha256 release/assets.json)  out/AgriAqua360-Windows-x64.zip" | sha256sum -c -
          ls -la out
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "AgriAqua 360 $GITHUB_REF_NAME" --notes-file release/NOTES.md --verify-tag
