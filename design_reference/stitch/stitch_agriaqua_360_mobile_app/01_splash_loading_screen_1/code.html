<!-- Client-side Status Transition Simulation -->
<script>
  (function() {
    const statuses = [
      "Initializing farm telemetry & AI models...",
      "Calibrating pond dissolved oxygen sensors...",
      "Syncing micro-climate weather matrices...",
      "Synthesizing hyper-local crop advisory..."
    ];
    let index = 0;
    const label = document.getElementById("telemetryStatus");
    if (label) {
      setInterval(() => {
        index = (index + 1) % statuses.length;
        label.style.opacity = '0';
        setTimeout(() => {
          label.textContent = statuses[index];
          label.style.opacity = '1';
        }, 220);
      }, 2600);
    }
  })();
